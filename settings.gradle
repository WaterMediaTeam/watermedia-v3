pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    // PLUGIN VERSIONS LIVE IN gradle.properties, NOT INLINE IN build.gradle
    plugins {
        id 'com.google.osdetector' version providers.gradleProperty('osdetector_version').get()
        id 'me.modmuss50.mod-publish-plugin' version providers.gradleProperty('publish_version').get()
    }
}

rootProject.name = 'watermedia'

// WATERMEDIA AND BINARIES ARE CODEPENDENT: WATERMEDIA COMPILES THE BINARIES SOURCES DIRECTLY
// (SEE build.gradle sourceSets; THEY SHIP ONLY IN THE BINARIES JAR) AND BINARIES COMPILES AGAINST
// WATERMEDIA. THIS INCLUDE ONLY KEEPS THE BINARIES BUILD REACHABLE FROM THE ROOT (IDE + `build`).
includeBuild("binaries")
