import me.modmuss50.mpp.platforms.curseforge.AdditionalFileOptions
import org.gradle.api.tasks.testing.Test

plugins {
    id 'java-library'
    id 'com.google.osdetector'
    id 'me.modmuss50.mod-publish-plugin'
}

java {
    withSourcesJar()
}

configurations {
    include
    jarJar {
        transitive = false
    }
    compileOnlyApi.extendsFrom(jarJar)
    compileOnly.extendsFrom(include)
    // LOCAL RUNS NEED HOST LIBRARIES WITHOUT EXPORTING THEM AS RUNTIME DEPENDENCIES.
    runtimeClasspath.extendsFrom(compileOnlyApi, include)
    testImplementation.extendsFrom(compileOnlyApi, include)
}

def binariesResources = files(layout.projectDirectory.dir('binaries/build/resources/main')).builtBy(gradle.includedBuild('binaries').task(':processResources'))
sourceSets {
    main.java.srcDirs += 'binaries/src/main/java'
    tools.java.srcDirs = ['src/test/tools']
    main.runtimeClasspath += binariesResources
    test.runtimeClasspath += binariesResources
}

def lwjglPlatform = ['windows': 'windows', 'linux': 'linux', 'osx': 'macos'][osdetector.os]
def lwjglArch = ['x86_64': '', 'aarch_64': '-arm64'][osdetector.arch]
if (lwjglPlatform == null || lwjglArch == null) throw new GradleException("Unsupported LWJGL test platform: $osdetector.classifier")
def lwjglNatives = "natives-$lwjglPlatform$lwjglArch"
def javafxPlatform = ['windows': 'win', 'linux': 'linux', 'osx': 'mac'][osdetector.os]
if (osdetector.arch == 'aarch_64' && osdetector.os != 'windows') javafxPlatform += '-aarch64'

dependencies {
    include "org.bytedeco:ffmpeg:$ffmpeg_version"
    jarJar "com.github.SrRapero720:waterconfig:$waterconfig_version"

    compileOnlyApi "org.tukaani:xz:$xz_version"
    compileOnlyApi "com.github.WaterMediaTeam:modloaders:$loaders_version"
    compileOnlyApi "com.google.code.gson:gson:$gson_version"
    compileOnlyApi "org.joml:joml:$joml_version"

    ['api', 'core'].each { module ->
        compileOnlyApi "org.apache.logging.log4j:log4j-$module:$log4j_version"
    }
    ['lwjgl', 'lwjgl-opengl', 'lwjgl-glfw', 'lwjgl-stb', 'lwjgl-openal', 'lwjgl-vulkan', 'lwjgl-shaderc'].each { module ->
        compileOnlyApi "org.lwjgl:$module:$lwjgl_version"
        // VULKAN USES THE SYSTEM LOADER EXCEPT ON MACOS, WHICH SHIPS MOLTENVK.
        if (module != 'lwjgl-vulkan' || osdetector.os == 'osx') {
            testRuntimeOnly "org.lwjgl:$module:$lwjgl_version:$lwjglNatives"
        }
    }
    ['base', 'graphics', 'swing'].each { module ->
        compileOnlyApi "org.openjfx:javafx-$module:$javafx_version:$javafxPlatform"
    }
}

test {
    maxHeapSize = test_max_heap
    jvmArgs "-XX:MaxDirectMemorySize=$test_max_direct_memory"
    systemProperty 'watermedia.test.requireNatives', require_natives
    doFirst { Test task ->
        task.systemProperty('watermedia.test.classpath', task.classpath.asPath)
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

sourcesJar {
    exclude 'org/watermedia/binaries/**'
}

// ALL LOADERS SHARE ONE NESTED JAR; FABRIC REQUIRES ITS OWN MOD DESCRIPTOR INSIDE IT.
def waterconfigJar = tasks.register('waterconfigJar', Jar) {
    archiveFileName = "waterconfig-$waterconfig_version" + '.jar'
    destinationDirectory = layout.buildDirectory.dir('jarjar')
    manifest.attributes 'FMLModType': 'GAMELIBRARY', 'Automatic-Module-Name': 'waterconfig'
    inputs.property('waterconfig_version', waterconfig_version)
    from({ zipTree(configurations.jarJar.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from('src/jarjar') {
        expand(waterconfig_version: waterconfig_version)
    }
}

processResources {
    from(waterconfigJar) {
        into 'META-INF/jarjar'
    }
}

jar {
    manifest.attributes 'Main-Class': mainclass
    from { configurations.include.collect { zipTree(it) } }
    exclude 'META-INF/versions/', 'META-INF/maven/', 'org/watermedia/binaries/**'
    filesMatching('META-INF/*') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

def publishVersion = project.version.toString()
publishMods {
    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    curseforge {
        serverRequired = true
        projectSlug = id
        additionalFile(sourcesJar) { AdditionalFileOptions file ->
            file.name = "$publishVersion-sources"
        }
        requires('watermedia-binaries')
    }
    modrinth {
        requires('watermedia-binaries')
    }
}

apply from: 'gradle/common.gradle'

// BUILD BOTH DISTRIBUTIONS; EACH BUILD ALSO COMPILES ITS MAINTENANCE TOOLS.
tasks.named('build') {
    dependsOn gradle.includedBuild('binaries').task(':build')
}
check.dependsOn tasks.named('compileToolsJava')

// LISTS PUBLIC METHODS WITHOUT JAVADOC, SKIPPING OVERRIDES AND THE INTERNAL PACKAGES OF gradle.properties.
def inventorySources = sourceSets.main.java
def inventoryRoot = layout.projectDirectory.asFile
def inventoryPackages = javadoc_internal_packages.split(',').collect { it.trim() }
tasks.register('javadocInventory') {
    group = 'documentation'
    description = 'Lists public methods without local Javadoc, excluding overrides and internal packages'
    doLast {
        def declaration = ~/^\s*public\s+(?:(?:static|final|synchronized|abstract|native|default)\s+)*(?!class\b|interface\b|enum\b|record\b)[\w<>?,.\[\] ]+\s+(\w+)\s*\(/
        int included = 0
        int excluded = 0
        int missing = 0
        inventorySources.files.sort { it.path }.each { file ->
            def lines = file.readLines('UTF-8')
            if (lines.any { line -> inventoryPackages.any { name ->
                line.startsWith("package $name;") || line.startsWith("package $name.")
            } }) {
                excluded++
                return
            }
            included++
            for (int i = 0; i < lines.size(); i++) {
                def match = lines[i] =~ declaration
                if (!match.find()) continue
                def method = match.group(1)
                int previous = i - 1
                boolean override = false
                while (previous >= 0 && (lines[previous].trim().isEmpty() || lines[previous].trim().startsWith('@'))) {
                    if (lines[previous].trim().startsWith('@Override')) override = true
                    previous--
                }
                boolean documented = false
                if (previous >= 0 && lines[previous].trim().endsWith('*/')) {
                    // ONLY COMMENT OPENERS COUNT; MIME PATTERNS INSIDE JAVADOC ARE ORDINARY TEXT.
                    while (previous >= 0) {
                        def line = lines[previous].stripLeading()
                        if (line.startsWith('/**')) { documented = true; break }
                        if (line.startsWith('/*')) break
                        previous--
                    }
                }
                if (!documented && !override) {
                    def path = inventoryRoot.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    logger.lifecycle("$path:${i + 1}:$method")
                    missing++
                }
            }
        }
        logger.lifecycle("Javadoc inventory: $missing candidates; $included included files; $excluded excluded files.")
    }
}

// NORMALIZE ENHANCED-FOR COLONS IN JAVA SOURCES.
def javaSources = fileTree(dir: 'src', include: '**/*.java')
tasks.register('removeSemicolonSpace') {
    group = 'formatting'
    description = 'Removes the space before the enhanced-for colon across src/**/*.java'
    doLast {
        // (?m) ANCHORS ^ PER LINE; [ \t] AND [^:\r\n] KEEP EACH MATCH INSIDE ONE LINE SO LINE ENDINGS SURVIVE
        def regex = ~/(?m)(^[ \t]*for[ \t]*\([^:\r\n]*\w)[ \t]+:/
        javaSources.each { file ->
            def text = file.getText('UTF-8')
            def updated = text.replaceAll(regex, '$1:')
            if (updated == text) return

            def before = text.readLines()
            def after = updated.readLines()
            before.eachWithIndex { line, i ->
                if (after[i] != line) {
                    println "${file.path}:${i + 1}"
                    println "  - ${line.stripLeading()}"
                    println "  + ${after[i].stripLeading()}"
                }
            }
            file.write(updated, 'UTF-8')
        }
        println 'Done.'
    }
}
