import org.gradle.api.attributes.Usage

plugins {
    id 'java'
    id "me.modmuss50.mod-publish-plugin" version "1.1.+"
}

def MT_TOKEN = System.getenv("MODRINTH_TOKEN")
def CF_TOKEN = System.getenv("CURSEFORGE_TOKEN")

base {
    archivesName = id
    libsDirectory = new File("builtJars/")
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
}

println("Gradle Java: ${JavaVersion.current()}")
println("Building project: ${properties.libname}")
println("Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Encoding: ${System.getProperty "file.encoding"}")

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "https://repo.spongepowered.org/maven" }
}

configurations {
    include
    include.extendsFrom(implementation)

    // BINARIES COMPILES AGAINST WATERMEDIA'S JAVA-API VARIANT SO IT INHERITS THE PROVIDED LIBS
    // WATERMEDIA EXPOSES VIA compileOnlyApi (tools, log4j, gson, modloaders) WITHOUT REDECLARING THEM
    library {
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        }
    }
}

sourceSets {
    // SHADOW
    main.compileClasspath += configurations.include
    main.runtimeClasspath += configurations.include
    test.compileClasspath += configurations.include
    test.runtimeClasspath += configurations.include

    // LIBRARY
    main.compileClasspath += configurations.library
    test.compileClasspath += configurations.library
    test.runtimeClasspath += configurations.library
}

dependencies {
    // WATERMEDIA IS THE PROVIDER: IT EXPOSES tools, log4j, gson AND modloaders TRANSITIVELY
    // (SEE ITS compileOnlyApi), SO BINARIES COMPILES AGAINST WATERMEDIA ALONE
    library "org.watermedia:watermedia"

    // SHADED INTO THE BINARIES JAR (XZ DECOMPRESSES THE SHIPPED NATIVE ZIPS)
    include "org.tukaani:xz:$xz_version"
}

// Process target resources with mod info
processResources {
    outputs.upToDateWhen { false }
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta', 'fabric.mod.json', "watermedia/version.cfg"]) {
        expand(project.properties)
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.WARN

    manifest {
        attributes "id"                         : id
        attributes "version"                    : version
        attributes "Specification-Title"        : id
        attributes "Specification-Vendor"       : authors
        attributes "Specification-Version"      : version
        attributes "Implementation-Title"       : id
        attributes "Implementation-Version"     : version
        attributes "Implementation-Vendor"      : authors
        attributes "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        attributes "Main-Class": "org.watermedia.app.Main"
    }
    from {
        configurations.include.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude('META-INF/versions/', 'META-INF/maven/')
    // COMBINE DUPLICATE SERVICE FILES INSTEAD OF OVERWRITING THEM
    filesMatching('META-INF/services/*') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

publishMods {
    file = jar.archiveFile
    changelog = getChangelogText()
    type = "alpha".equalsIgnoreCase(project.properties.versiontype?.toString())
            ? ALPHA : "beta".equalsIgnoreCase(project.properties.versiontype?.toString())
            ? BETA : "release".equalsIgnoreCase(project.properties.versiontype?.toString())
            ? STABLE : ALPHA
    displayName = "WM-Binaries/${project.properties.version}"
    modLoaders.add("forge")
    modLoaders.add("neoforge")
    modLoaders.add("fabric")
    maxRetries = 2

    dryRun = false

    curseforge {
        accessToken = CF_TOKEN
        projectId = curseforgeid
        minecraftVersions.addAll("1.18.2", "1.19.2", "1.20.1", "1.21.1", "1.21.11")
        javaVersions.addAll(JavaVersion.VERSION_25, JavaVersion.VERSION_21, JavaVersion.VERSION_17)
        clientRequired = true
        serverRequired = false
        projectSlug = id
        requires("watermedia")
    }

    modrinth {
        accessToken = MT_TOKEN
        projectId = modrinthid
        minecraftVersions.addAll("1.18.2", "1.19.2", "1.20.1", "1.21.1", "1.21.11")
        requires("watermedia")
    }
}

def getChangelogText() {
    def result = ""
    for (String line: file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}