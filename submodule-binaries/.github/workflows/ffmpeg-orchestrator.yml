name: FFmpeg Build Orchestrator

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version to build'
        required: true
        default: '8.0.1'
        type: string

jobs:
  linux-x64:
    uses: ./.github/workflows/ffmpeg-linux-x64.yml
    with:
      ffmpeg_version: ${{ inputs.ffmpeg_version }}

  linux-arm64:
    uses: ./.github/workflows/ffmpeg-linux-arm64.yml
    with:
      ffmpeg_version: ${{ inputs.ffmpeg_version }}

  macos-x64:
    uses: ./.github/workflows/ffmpeg-macos-x64.yml
    with:
      ffmpeg_version: ${{ inputs.ffmpeg_version }}

  macos-arm64:
    uses: ./.github/workflows/ffmpeg-macos-arm64.yml
    with:
      ffmpeg_version: ${{ inputs.ffmpeg_version }}

  windows-x64:
    uses: ./.github/workflows/ffmpeg-windows-x64.yml
    with:
      ffmpeg_version: ${{ inputs.ffmpeg_version }}

  # windows-arm64 IS PARKED (NO JNI GLUE — SEE ffmpeg-windows-arm64.yml) AND IS
  # INTENTIONALLY EXCLUDED FROM THE ORCHESTRATOR. RUN IT ON DEMAND IF NEEDED.

  create-pr:
    needs: [linux-x64, linux-arm64, macos-x64, macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    name: Create Pull Request
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Gist with configure help files
        id: create-gist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prepare gist content
          mkdir -p gist-content
          
          # Copy all configure help files
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            if [ -f "artifacts/configure-help-${platform}/configure-help-${platform}.txt" ]; then
              cp "artifacts/configure-help-${platform}/configure-help-${platform}.txt" "gist-content/"
            fi
          done
          
          # Create gist description
          GIST_DESC="FFmpeg ${{ inputs.ffmpeg_version }} configure --help outputs for all platforms ($(date -u +%Y-%m-%d))"
          
          # Create gist using gh CLI
          cd gist-content
          GIST_URL=$(gh gist create \
            --public \
            --desc "$GIST_DESC" \
            configure-help-*.txt 2>&1 | tail -1)
          
          echo "gist_url=$GIST_URL" >> $GITHUB_OUTPUT
          echo "Created Gist: $GIST_URL"

      - name: Create branch and update binaries
        run: |
          BRANCH_NAME="update-ffmpeg-${{ inputs.ffmpeg_version }}-$(date +%Y%m%d-%H%M%S)"
          LIBS_DIR="src/main/resources/libs"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create new branch
          git checkout -b "$BRANCH_NAME"
          
          # Create libs directory if it doesn't exist
          mkdir -p "$LIBS_DIR"
          
          # Remove old zip files
          rm -f "$LIBS_DIR"/*.zip
          echo "Removed old binaries"
          
          # Copy new zip files, NAMED FOR IOTool.platformClassifier(): x64 carries NO
          # arch suffix (ffmpeg-linux.zip) while arm64 keeps it (ffmpeg-linux-arm64.zip).
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64; do
            src="artifacts/ffmpeg-${platform}/ffmpeg-${platform}.zip"
            [ -f "$src" ] || continue
            cp "$src" "$LIBS_DIR/ffmpeg-${platform%-x64}.zip"
          done
          
          echo "Copied new binaries:"
          ls -la "$LIBS_DIR"/*.zip || echo "No zip files found"
          
          # Commit changes
          git add "$LIBS_DIR"
          git commit -m "Update FFmpeg binaries to ${{ inputs.ffmpeg_version }}"
          
          # Push branch
          git push origin "$BRANCH_NAME"
          
          # Save branch name for PR step
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="## FFmpeg ${{ inputs.ffmpeg_version }} Binaries Update

          This PR updates the FFmpeg binaries to version **${{ inputs.ffmpeg_version }}**.

          ### Included platforms:
          - ✅ Linux x64
          - ✅ Linux ARM64
          - ✅ macOS x64
          - ✅ macOS ARM64
          - ✅ Windows x64
          - ⏸️ Windows ARM64 — parked (FFmpeg only, no JNI glue; needs ARM hardware)

          ### Changes:
          - Removed old binary zip files from \`src/main/resources/libs\`
          - Added new FFmpeg ${{ inputs.ffmpeg_version }} binaries

          ### Configure Help Reference
          Full \`./configure --help\` output for all platforms is available in this Gist:
          ${{ steps.create-gist.outputs.gist_url }}

          ---
          *This PR was automatically generated by the FFmpeg Build Orchestrator workflow.*"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Update FFmpeg binaries to ${{ inputs.ffmpeg_version }}" \
            --body "$PR_BODY"
