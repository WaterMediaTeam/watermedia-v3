name: FFmpeg macOS ARM64

on:
  workflow_call:
    inputs:
      ffmpeg_version:
        required: true
        type: string
  # STANDALONE TRIGGER FOR ITERATING THIS PLATFORM WITHOUT THE FULL ORCHESTRATOR.
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg version to build'
        required: true
        default: '8.0.1'
        type: string

env:
  FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
  # BYTEDECO COORDINATE TO PULL THE JNI GLUE FROM. MUST MATCH org.bytedeco:ffmpeg
  # IN THE MAIN PROJECT build.gradle SO THE GLUE MATCHES THE JAVA BINDINGS, AND ITS
  # ffmpeg PART MUST SHARE THE SONAME MAJOR (avcodec-62/avutil-60/...) WITH OUR BUILD.
  BYTEDECO_VERSION: 8.0.1-1.5.13

jobs:
  build:
    runs-on: macos-14
    name: Build macOS ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          # DON'T LET brew install AUTO-UPGRADE UNRELATED PRE-INSTALLED RUNNER
          # PACKAGES (e.g. xcodes, WHICH HAS NO BOTTLE AND FAILS THE STEP).
          # ONLY THE BUILD DEPENDENCIES BELOW ARE NEEDED.
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
        run: |
          brew update
          brew install \
            nasm yasm pkg-config cmake meson ninja \
            x264 x265 libvpx lame opus libvorbis theora libogg \
            libass freetype fontconfig fribidi harfbuzz gnutls \
            sdl2 aom dav1d webp libsoxr zimg zeromq \
            speex two-lame libbluray libgme rubberband \
            srt libssh libxml2 snappy openjpeg libbs2b libcaca \
            rav1e jpeg-xl librsvg xvid opencore-amr \
            kvazaar openh264 librist lv2 lilv \
            gmp openssl

      - name: Build SVT-AV1 v3.1.2
        run: |
          # FFMPEG 8.0.1 NEEDS SVT-AV1 <= 3.1.2 (LATER RELEASES DROPPED THE
          # enable_adaptive_quantization FIELD THAT libsvtav1.c STILL SETS). brew SHIPS
          # A ROLLING (TOO NEW) PACKAGE, SO WE BUILD THE PINNED VERSION FROM SOURCE.
          git clone --depth 1 --branch v3.1.2 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1/Build
          # ABSOLUTE INSTALL NAME SO "Test binaries" RESOLVES IT BEFORE BUNDLING
          # (dylibbundler LATER REWRITES IT TO @loader_path FOR THE SHIPPED ZIP).
          cmake .. -G"Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_INSTALL_NAME_DIR=/usr/local/lib -DBUILD_SHARED_LIBS=ON
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Download FFmpeg source
        run: |
          curl -L "https://ffmpeg.org/releases/ffmpeg-${{ env.FFMPEG_VERSION }}.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          mv ffmpeg-${{ env.FFMPEG_VERSION }} ffmpeg-src

      - name: Save configure help
        working-directory: ffmpeg-src
        run: |
          ./configure --help > "${{ github.workspace }}/configure-help-macos-arm64.txt"

      - name: Configure FFmpeg
        working-directory: ffmpeg-src
        run: |
          # Collect keg-only package paths
          PKG_PATHS=""
          EXTRA_CFLAGS=""
          EXTRA_LDFLAGS=""
          
          for pkg in x264 x265 lame opus libvorbis theora libogg libass freetype fontconfig \
                     fribidi harfbuzz gnutls sdl2 aom dav1d webp libsoxr speex \
                     libbluray libgme rubberband srt libssh libxml2 snappy openjpeg \
                     libbs2b rav1e svt-av1 jpeg-xl librsvg xvid opencore-amr \
                     kvazaar openh264 librist lv2 lilv gmp openssl; do
            if brew --prefix "$pkg" &>/dev/null; then
              PKG_PREFIX="$(brew --prefix "$pkg")"
              if [ -d "$PKG_PREFIX/lib/pkgconfig" ]; then
                PKG_PATHS="$PKG_PREFIX/lib/pkgconfig:$PKG_PATHS"
              fi
              EXTRA_CFLAGS="$EXTRA_CFLAGS -I$PKG_PREFIX/include"
              EXTRA_LDFLAGS="$EXTRA_LDFLAGS -L$PKG_PREFIX/lib"
            fi
          done
          
          # OUR PINNED SVT-AV1 v3.1.2 LIVES IN /usr/local (SEE "Build SVT-AV1" STEP)
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_PATHS$PKG_CONFIG_PATH"
          
          ./configure \
            --prefix="${{ github.workspace }}/ffmpeg-build" \
            --enable-gpl \
            --enable-version3 \
            --enable-shared \
            --disable-static \
            --enable-pic \
            --enable-pthreads \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-debug \
            --enable-libaom \
            --enable-libass \
            --enable-libbluray \
            --enable-libbs2b \
            --enable-libcaca \
            --enable-libdav1d \
            --enable-libfontconfig \
            --enable-libfreetype \
            --enable-libfribidi \
            --enable-libharfbuzz \
            --enable-libgme \
            --enable-libkvazaar \
            --enable-libmp3lame \
            --enable-libopencore-amrnb \
            --enable-libopencore-amrwb \
            --enable-libopenh264 \
            --enable-libopenjpeg \
            --enable-libopus \
            --enable-librav1e \
            --enable-librist \
            --enable-librsvg \
            --enable-librubberband \
            --enable-libsnappy \
            --enable-libsoxr \
            --enable-libspeex \
            --enable-libsrt \
            --enable-libssh \
            --enable-libsvtav1 \
            --enable-libtheora \
            --enable-libvorbis \
            --enable-libvpx \
            --enable-libwebp \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libxvid \
            --enable-libxml2 \
            --enable-libzimg \
            --enable-libzmq \
            --enable-libjxl \
            --enable-lv2 \
            --enable-openssl \
            --enable-gmp \
            --enable-videotoolbox \
            --enable-audiotoolbox \
            --extra-cflags="$EXTRA_CFLAGS" \
            --extra-ldflags="$EXTRA_LDFLAGS"

      - name: Build FFmpeg
        working-directory: ffmpeg-src
        run: |
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Test binaries
        run: |
          ${{ github.workspace }}/ffmpeg-build/bin/ffmpeg -version
          ${{ github.workspace }}/ffmpeg-build/bin/ffprobe -version

      - name: Package binaries
        run: |
          cd "${{ github.workspace }}/ffmpeg-build"
          mkdir -p package
          cp lib/*.dylib package/ 2>/dev/null || true
          # JAVACPP JNI GLUE (libjni*.dylib) — REUSED FROM BYTEDECO, BOUND TO OUR LIBS BY SONAME.
          curl -L -o "${{ github.workspace }}/javacpp-ffmpeg.jar" \
            "https://repo1.maven.org/maven2/org/bytedeco/ffmpeg/${{ env.BYTEDECO_VERSION }}/ffmpeg-${{ env.BYTEDECO_VERSION }}-macosx-arm64.jar"
          unzip -j -o "${{ github.workspace }}/javacpp-ffmpeg.jar" "org/bytedeco/ffmpeg/macosx-arm64/*jni*" -d package

          # BUNDLE NON-SYSTEM DYLIB DEPS (svtav1 + brew codecs) AND REWRITE INSTALL NAMES
          # TO @loader_path SO THE ZIP IS SELF-CONTAINED (JavaCPP ONLY PRELOADS av*).
          # COLLECT: COPY IN EVERY /usr/local + /opt/homebrew DEP (otool), TO CLOSURE.
          # SYSTEM LIBS (/usr/lib, /System) STAY ON THE HOST.
          for _ in $(seq 1 12); do
            found=0
            for f in package/*.dylib; do
              [ -f "$f" ] || continue
              while read -r dep _; do
                case "$dep" in
                  /usr/local/*|/opt/homebrew/*)
                    base=$(basename "$dep")
                    if [ ! -e "package/$base" ] && [ -f "$dep" ]; then
                      cp "$dep" "package/$base"; chmod +w "package/$base"; found=1
                    fi ;;
                esac
              done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')
            done
            if [ "$found" = 0 ]; then break; fi
          done
          # REWRITE @rpath + ABSOLUTE REFS TO @loader_path, THEN AD-HOC RE-SIGN
          # (arm64 REJECTS DYLIBS WITH AN INVALID SIGNATURE AFTER install_name_tool).
          for f in package/*.dylib; do
            [ -f "$f" ] || continue
            install_name_tool -id "@loader_path/$(basename "$f")" "$f" 2>/dev/null || true
            while read -r dep _; do
              base=$(basename "$dep")
              case "$dep" in
                /usr/local/*|/opt/homebrew/*|@rpath/*)
                  if [ -e "package/$base" ]; then
                    install_name_tool -change "$dep" "@loader_path/$base" "$f" 2>/dev/null || true
                  fi ;;
              esac
            done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')
            codesign --force --sign - "$f" 2>/dev/null || true
          done
          echo "${{ env.FFMPEG_VERSION }}" > package/version.cfg
          cd package
          zip -r ../ffmpeg-macos-arm64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ${{ github.workspace }}/ffmpeg-build/ffmpeg-macos-arm64.zip
          retention-days: 7

      - name: Upload configure help
        uses: actions/upload-artifact@v4
        with:
          name: configure-help-macos-arm64
          path: ${{ github.workspace }}/configure-help-macos-arm64.txt
          retention-days: 7
